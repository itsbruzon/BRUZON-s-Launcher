name: Temporary Profiles Match Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'fix: handle Profiles section') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add Profiles match arm
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/ui/mod.rs')
          text = path.read_text()
          old = '''                    Section::Home => {\n                        widgets.home_button.add_css_class("suggested-action");\n                        widgets.content_stack.set_visible_child_name("home");\n                        update_profile_list(&widgets.profile_list, &self.profiles, &self.sender);\n                    }\n                    Section::CreateInstance => {'''
          new = '''                    Section::Home => {\n                        widgets.home_button.add_css_class("suggested-action");\n                        widgets.content_stack.set_visible_child_name("home");\n                        update_profile_list(&widgets.profile_list, &self.profiles, &self.sender);\n                    }\n                    Section::Profiles => {\n                        widgets.content_stack.set_visible_child_name("profiles");\n                    }\n                    Section::CreateInstance => {'''
          if old not in text:
              raise SystemExit('Expected Profiles insertion point was not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit fix and remove temporary workflow
        run: |
          rm .github/workflows/temporary-fix-profiles.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ui/mod.rs .github/workflows/temporary-fix-profiles.yml
          git commit -m 'fix: handle Profiles section'
          git push
